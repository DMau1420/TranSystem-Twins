[project]
name = "backend"
version = "0.1.0"
description = "TranSystem Twins Backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.12.0",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
