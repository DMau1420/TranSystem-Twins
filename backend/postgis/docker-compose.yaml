services:
  postgis:
    image: postgis/postgis
    container_name: postgis_prueba
    restart: always
    environment:
      - POSTGRES_BD=gis
      - POSTGRES_USER=gis
      - POSTGRES_PASSWORD=password
    ports:
      - 5432:5432
    volumes:
      - ./data/postgis:/var/lib/postgresql
    networks:
      - postgis_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_postgis_prue
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8080:80"
    networks:
      - postgis_net
    depends_on:
      - postgis

networks:
  postgis_net:
    driver: bridge
