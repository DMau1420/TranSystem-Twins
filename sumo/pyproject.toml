[project]
name = "sumo"
version = "0.1.0"
description = "TranSystem Twins SUMO"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "sumolib>=1.27.1",
    "traci>=1.27.1",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
markers = [
    "integration: tests de integración que requieren SUMO instalado",
]
